name: fandom_verse
description: "Fandom Verse Pocket Edition - Fandom Trivia on the Go."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.1.0
  http: ^1.2.2
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_ai: ^4.0.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
  - assets/images/fandom_verse_splash.png
  - assets/images/fandom_verse_logo.png
  - assets/images/fan_card_image.png
  - assets/images/admin_card_image.png
  - assets/images/fv_launcher_icon.png
  - assets/images/fan_login_banner.jpg
  - assets/images/admin_login_banner.jpg
  - assets/images/signup_banner.jpg
  - assets/images/reset_password_art.png
  - assets/images/categories/